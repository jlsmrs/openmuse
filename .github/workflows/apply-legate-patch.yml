name: Apply legate patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/legate-avatar
      - name: Apply patch and clean up
        run: |
          git config user.name "jlsmrs"
          git config user.email "jlsmrs@users.noreply.github.com"
          git apply legate-avatar.patch
          git rm -q legate-avatar.patch
          rm -f .github/workflows/apply-legate-patch.yml
          git add -A
          git status --short
          git commit -m "Custom avatar: signed-URL generated images + custom picker option"
          git push origin feat/legate-avatar
